<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <title>Flight Log</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Leaflet (map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- App shell -->
  <header class="topbar">
    <div class="header-grid">

      <div class="header-box brand-box">
        <div class="brand">
          <span class="brand-mark">✈</span>
          <h1>Flight<span class="brand-amp">&nbsp;</span>Log</h1>
        </div>
        <nav class="tabs" id="tabs">
          <button data-tab="log" class="active" title="Log">
            <img src="assets/icons/log.png" alt="" class="tab-icon">
            <span class="tab-label">Log</span>
          </button>
          <button data-tab="map" title="Map">
            <img src="assets/icons/map.png" alt="" class="tab-icon">
            <span class="tab-label">Map</span>
          </button>
          <button data-tab="status" title="Status">
            <img src="assets/icons/status.png" alt="" class="tab-icon">
            <span class="tab-label">Status</span>
          </button>
        </nav>
      </div>

      <div class="header-box loyalty-box">
        <button class="loyalty-brand-btn" data-tab="trains" title="Train Log">
          <span class="brand-mark train-mark">🚄</span>
          <h1 class="loyalty-brand-title">Train&nbsp;Log</h1>
        </button>
        <div class="actions">
          <button id="auth-btn" class="ghost">Sign in</button>
          <button id="settings-btn" class="ghost" aria-label="Settings">⚙</button>
        </div>
      </div>

    </div>
  </header>

  <!-- Status banner (shows loading / errors / counts) -->
  <div id="banner" class="banner hidden"></div>

  <!-- Tab panels -->
  <main id="panels">
    <section class="panel active" data-panel="log">
    </section>
    <section class="panel" data-panel="map">
    </section>
    <section class="panel" data-panel="status">
    </section>
    <section class="panel" data-panel="trains">
    </section>
  </main>

  <!-- Sign-in modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Sign in</h2>
      <p class="muted">Enter your email and password to unlock the flight log.</p>
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-pwd" placeholder="Password" autocomplete="current-password">
      <button id="auth-submit" class="primary">Sign in</button>
      <p id="auth-msg" class="muted small"></p>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <label class="row">
        <span>Distance unit</span>
        <select id="unit-select">
          <option value="km">Kilometers</option>
          <option value="mi">Miles</option>
        </select>
      </label>
      <button class="ghost" id="manage-airports-btn">Manage airports…</button>
      <button class="ghost" id="lock-btn">Sign out</button>
      <button class="primary" id="settings-close">Done</button>
    </div>
  </div>

  <!-- Supabase JS client (vendored from CDN — only request) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- App config and modules (loaded as ES modules) -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
